{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
  <div class="auth-card auth-card-wide">
    <h1><span aria-hidden="true">🏬</span> Create your wholesaler account</h1>
    <form method="post">
      <div class="form-grid">
        <div class="form-group"><label>Full name</label><input type="text" name="full_name" value="{{ form.get('full_name','') }}" required></div>
        <div class="form-group"><label>Phone number</label><input type="tel" name="phone" value="{{ form.get('phone','') }}" placeholder="e.g. 9876543210" maxlength="10" minlength="10" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" required></div>
        <div class="form-group"><label>Business name</label><input type="text" name="business_name" value="{{ form.get('business_name','') }}" required></div>
        <div class="form-group"><label>Mandi location</label><input type="text" name="mandi_location" value="{{ form.get('mandi_location','') }}" required></div>
        <div class="form-group"><label>Create password</label><input type="password" name="password" required></div>
      </div>
      <button class="btn btn-primary" type="submit">Sign up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('wholesaler.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<!-- Blurry Background Wrapper for Home Page -->
<div class="auth-bg-wrapper">
  <div class="auth-bg-inner" style="background-image: url_for('static', filename='images/background.jpg');"></div>
</div>

<section class="hero" style="position: relative; overflow: hidden; min-height: 520px; display: flex; align-items: center; justify-content: center; border-radius: 18px; margin: 15px auto; max-width: 1200px; width: 100%; isolation: isolate; background-color: #1b5e20;">

  <!-- Soft Green Gradient Tint for Crisp Text Contrast -->
  <div style="
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(20, 70, 25, 0.65) 0%, rgba(10, 40, 15, 0.88) 100%);
    pointer-events: none;
    z-index: 3;
  "></div>

  <!-- Translucent Custom Background Image Layer (Watermark Style) -->
  <div style="
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://th.bing.com/th/id/OIP.LYvvEE9lw3SXdYjoQN-a3AHaD-?w=298&h=180&c=7&r=0&o=7&pid=1.7&rm=3');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.18;
    mix-blend-mode: luminosity;
    z-index: 3;
    pointer-events: none;
  "></div>

  <!-- Top-Right Circular National Emblem Badge -->
  <div id="krEmblemContainer" style="
    position: absolute;
    top: 24px;
    right: 28px;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    border: 2.5px solid #fbc02d;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 6px;
    box-sizing: border-box;
    overflow: hidden;
  ">
    <img 
      src="{{ url_for('static', filename='images/emblem.png') }}" 
      alt="State Emblem of India" 
      style="width: 100%; height: 100%; object-fit: contain; display: block;"
      onerror="if (!this.dataset.failed) { this.dataset.failed = '1'; this.src = '/static/images/emblem.jpg'; }"
    />
  </div>

  <!-- Hero Main Content (Locked Dead-Center) -->
  <div class="hero-content" style="
    position: relative;
    z-index: 5;
    text-align: center;
    width: 100%;
    max-width: 900px;
    padding: 40px 20px;
    margin: 0 auto;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  ">
    <p class="hero-eyebrow" style="
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #dcedc8;
      margin: 0 0 14px 0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      text-align: center;
    ">
      Farm to market, on one route
    </p>

    <h1 style="
      font-size: clamp(48px, 7vw, 84px);
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
      margin: 0 0 18px 0;
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.75), 0 2px 5px rgba(0, 0, 0, 0.9);
      font-family: 'Fraunces', Georgia, serif;
      white-space: nowrap;
      text-align: center;
    ">
      {{ t('site_name') }}
    </h1>

    <p class="hero-tagline" style="
      font-size: 19px;
      line-height: 1.6;
      font-weight: 500;
      color: #f1f8e9;
      max-width: 740px;
      margin: 0 auto;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      text-align: center;
    ">
      {{ t('hero_tagline') }}
    </p>
  </div>
</section>

<!-- Single Clean Problem Section -->
<div style="max-width: 1200px !important; width: 95% !important; margin: 35px auto !important; background: #ffffff !important; border-radius: 16px !important; padding: 32px 40px !important; border: none !important; border-left: 6px solid #2e7d32 !important; box-shadow: 0 4px 20px rgba(0,0,0,0.06) !important; box-sizing: border-box !important; display: block !important;">
  <h2 style="color: #1b5e20 !important; font-size: 24px !important; font-weight: 800 !important; margin: 0 0 12px 0 !important; border: none !important; background: none !important; padding: 0 !important;">{{ t('problem_title') }}</h2>
  <p style="color: #3e4a42 !important; font-size: 16.5px !important; line-height: 1.8 !important; margin: 0 !important; border: none !important; background: none !important; padding: 0 !important;">{{ t('problem_text') }}</p>
</div>
{% endblock %}

<!-- ================= CINEMATIC TRANSITION CONTROLLER SCRIPT ================= -->
<script>
(function() {
  var transitionTimer = null;
  var isTransitionActive = false;
  var targetDestination = null;

  // Global Trigger Function
  window.triggerKisanTransition = function(opts) {
    if (isTransitionActive) return;
    
    opts = opts || {};
    var url = opts.url || '/';
    var title = opts.title || 'खेत से सीधे मंडी की ओर...';
    var duration = opts.duration || 2600; // 2.6 seconds full experience

    var overlay = document.getElementById('krTransitionOverlay');
    var destLabel = document.getElementById('krTransitionDestLabel');
    var progressBar = document.getElementById('krTransitionProgressBar');
    var artworkImg = document.getElementById('krTransitionArtworkImg');

    if (!overlay) {
      window.location.href = url;
      return;
    }

    isTransitionActive = true;
    targetDestination = url;

    // Set dynamic destination
    if (destLabel) destLabel.textContent = title;

    // Reset animations
    overlay.classList.remove('kr-fade-out');
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');

    if (progressBar) {
      progressBar.style.animation = 'none';
      void progressBar.offsetWidth; // trigger reflow
      progressBar.style.animation = 'krProgressFill ' + (duration / 1000).toFixed(2) + 's cubic-bezier(0.25, 1, 0.5, 1) forwards';
    }

    if (artworkImg) {
      artworkImg.style.animation = 'none';
      void artworkImg.offsetWidth;
      artworkImg.style.animation = 'krKenBurns 4.5s ease-out forwards';
    }

    // Trigger words animation reset
    var words = overlay.querySelectorAll('.kr-word, .kr-kinetic-hindi, .kr-kinetic-chips');
    words.forEach(function(el) {
      var prevAnimation = el.style.animation;
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = prevAnimation;
    });

    // Schedule Exit Transition at (duration - 400ms) for smooth fade out
    if (transitionTimer) clearTimeout(transitionTimer);
    transitionTimer = setTimeout(function() {
      executeExitNavigation(url);
    }, duration);
  };

  // Smooth Exit and Navigation
  function executeExitNavigation(url) {
    var overlay = document.getElementById('krTransitionOverlay');
    if (overlay) {
      overlay.classList.add('kr-fade-out');
    }
    setTimeout(function() {
      if (url) {
        window.location.href = url;
      }
    }, 380);
  }

  document.addEventListener('DOMContentLoaded', function() {
    // 1. Skip Button Handler
    var skipBtn = document.getElementById('krSkipTransitionBtn');
    if (skipBtn) {
      skipBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (transitionTimer) clearTimeout(transitionTimer);
        executeExitNavigation(targetDestination || '/');
      });
    }

    // 2. Intercept Internal Navigation Links & Dashboard Switches
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;

      // Ignore modifier clicks (open in new tab/window)
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
      if (a.target === '_blank' || a.hasAttribute('download')) return;
      
      var href = a.getAttribute('href');
      if (!href || href === '#' || href.startsWith('javascript:') || href.startsWith('tel:') || href.startsWith('mailto:') || href.startsWith('whatsapp:')) return;

      var destUrl;
      try {
        destUrl = new URL(a.href, window.location.origin);
      } catch(err) {
        return;
      }
      if (destUrl.origin !== window.location.origin) return;

      // Skip if clicking same exact URL
      if (destUrl.pathname === window.location.pathname && destUrl.search === window.location.search) return;

      var destPath = destUrl.pathname.toLowerCase();

      // Check if navigating to key portals, dashboards, or main tabs
      var isDashboardTarget = destPath.indexOf('/dashboard') !== -1 ||
                              destPath.indexOf('/mandi-rates') !== -1 ||
                              destPath.indexOf('/profit-calculator') !== -1 ||
                              destPath.indexOf('/crop-quality') !== -1 ||
                              destPath.indexOf('/schemes') !== -1 ||
                              destPath.indexOf('/insurance') !== -1 ||
                              destPath.indexOf('/tracking') !== -1;

      var isPortalSwitch = destPath.startsWith('/farmer') ||
                           destPath.startsWith('/wholesaler') ||
                           destPath.startsWith('/driver') ||
                           destPath.startsWith('/cluster') ||
                           destPath.startsWith('/customer') ||
                           destPath === '/about' ||
                           (destPath === '/' && window.location.pathname !== '/');

      if (isDashboardTarget || isPortalSwitch) {
        if (a.dataset.noTransition === 'true' || a.closest('.kr-bypass-overlay')) return;

        e.preventDefault();

        var title = '🌾 खेत से सीधे मंडी की ओर...';
        if (destPath.indexOf('/farmer') !== -1) {
          title = '🌾 किसान पोर्टल (Farmer Hub) की ओर...';
        } else if (destPath.indexOf('/wholesaler') !== -1) {
          title = '🏬 थोक व्यापारी पोर्टल (Wholesaler Hub)...';
        } else if (destPath.indexOf('/driver') !== -1) {
          title = '🚚 ड्राइवर व ट्रांसपोर्ट नेटवर्क (Logistics)...';
        } else if (destPath.indexOf('/cluster') !== -1) {
          title = '🤝 किसान क्लस्टर हब (Cluster Hub)...';
        } else if (destPath.indexOf('/customer') !== -1) {
          title = '🛒 ताज़ा फसल स्टोर (Customer Hub)...';
        } else if (destPath === '/about') {
          title = 'ℹ️ KisanRoute मिशन व विजन...';
        } else if (destPath === '/') {
          title = '🏠 KisanRoute मुख्य पृष्ठ...';
        }

        window.triggerKisanTransition({
          title: title,
          duration: 2600,
          url: a.href
        });
      }
    });

    // 3. Floating Scroll to Top Button Interaction
    var scrollBtn = document.getElementById('krScrollToTopBtn');
    if (scrollBtn) {
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 320) {
          scrollBtn.style.display = 'flex';
        } else {
          scrollBtn.style.display = 'none';
        }
      }, { passive: true });

      scrollBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  });
})();
</script>

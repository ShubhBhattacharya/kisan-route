<!-- ================= PWA INSTALL PROMPT BANNER FOR MOBILE ================= -->
<div id="krPwaInstallBanner" style="
  display: none;
  position: fixed;
  bottom: 84px;
  left: 12px;
  right: 12px;
  max-width: 440px;
  margin: 0 auto;
  background: #ffffff;
  border: 2px solid #2e7d32;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  padding: 12px 14px;
  z-index: 99998;
  align-items: center;
  gap: 12px;
  font-family: 'Inter', -apple-system, sans-serif;
  animation: krSlideUp 0.3s ease-out;
">
  <!-- App Icon Preview -->
  <img src="/static/images/icons/icon-192.png" alt="Kisan Route" style="
    width: 46px;
    height: 46px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  " />

  <!-- App Info -->
  <div style="flex: 1; min-width: 0;">
    <div style="font-size: 14.5px; font-weight: 700; color: #1b5e20; line-height: 1.2;">
      🌾 Kisan Route ऐप
    </div>
    <div style="font-size: 12px; color: #4a5d52; margin-top: 2px; line-height: 1.3;">
      फ़ोन में इंस्टॉल करें (बिना Play Store)
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <button id="krPwaInstallBtn" type="button" style="
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(27, 94, 32, 0.3);
      white-space: nowrap;
    ">
      <span>📲</span> <span>इंस्टॉल</span>
    </button>

    <button id="krPwaDismissBtn" type="button" aria-label="Close banner" style="
      background: #f1f5f2;
      border: none;
      color: #6c7d73;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    ">&times;</button>
  </div>
</div>

<!-- iOS Install Help Modal (Only shown if iOS user clicks install) -->
<div id="krIosInstallModal" style="
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  z-index: 100000;
  align-items: center;
  justify-content: center;
  padding: 16px;
  font-family: 'Inter', -apple-system, sans-serif;
">
  <div style="
    background: #ffffff;
    max-width: 360px;
    width: 100%;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    text-align: center;
  ">
    <div style="font-size: 34px; margin-bottom: 8px;">📲</div>
    <h3 style="color: #1b5e20; margin: 0 0 10px 0; font-size: 18px;">iPhone पर ऐप कैसे जोड़ें:</h3>
    <ol style="text-align: left; font-size: 14px; line-height: 1.7; color: #333; padding-left: 20px; margin: 0 0 18px 0;">
      <li>नीचे सफारी में <strong>Share (⎋ / [↑])</strong> बटन दबाएं।</li>
      <li>थोड़ा नीचे स्क्रॉल करके <strong>'Add to Home Screen' (+)</strong> चुनें।</li>
      <li>ऊपर दाएं कोने में <strong>Add</strong> पर क्लिक करें।</li>
    </ol>
    <button id="krIosCloseBtn" type="button" style="
      background: #2e7d32;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    ">समझ गया (OK)</button>
  </div>
</div>

<style>
@keyframes krSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
(function() {
  let deferredPrompt = null;
  const banner = document.getElementById('krPwaInstallBanner');
  const installBtn = document.getElementById('krPwaInstallBtn');
  const dismissBtn = document.getElementById('krPwaDismissBtn');
  const iosModal = document.getElementById('krIosInstallModal');
  const iosClose = document.getElementById('krIosCloseBtn');

  // Check if already running in standalone PWA mode
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) {
    return; // Already installed as an app, don't show install banner
  }

  // Check dismiss storage (hide for 3 days if user clicked cross)
  const dismissedTime = localStorage.getItem('kr_pwa_dismissed');
  const isDismissedRecently = dismissedTime && (Date.now() - parseInt(dismissedTime, 10)) < 3 * 24 * 60 * 60 * 1000;

  // Detect iOS Safari
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|Chrome/.test(navigator.userAgent);

  // Chrome / Android PWA Install Event
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isDismissedRecently && banner) {
      setTimeout(() => {
        banner.style.display = 'flex';
      }, 1500);
    }
  });

  // Handle Install button click
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          console.log('User installed Kisan Route PWA');
          if (banner) banner.style.display = 'none';
        }
        deferredPrompt = null;
      } else if (isIos && iosModal) {
        // Show iOS instructions modal
        iosModal.style.display = 'flex';
      } else {
        // Fallback: alert instructions
        alert("ऐप को अपनी होम स्क्रीन पर जोड़ने के लिए ब्राउज़र मेनू (⋮) पर क्लिक करें और 'Add to Home Screen' या 'Install App' चुनें।");
      }
    });
  }

  // Dismiss button click
  if (dismissBtn) {
    dismissBtn.addEventListener('click', () => {
      if (banner) banner.style.display = 'none';
      localStorage.setItem('kr_pwa_dismissed', Date.now().toString());
    });
  }

  // iOS modal close
  if (iosClose && iosModal) {
    iosClose.addEventListener('click', () => {
      iosModal.style.display = 'none';
      if (banner) banner.style.display = 'none';
    });
  }

  // Show banner on iOS Safari if not dismissed
  if (isIos && isSafari && !isDismissedRecently && banner) {
    setTimeout(() => {
      banner.style.display = 'flex';
    }, 2000);
  }

  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then((reg) => {
          console.log('Kisan Route Service Worker registered with scope:', reg.scope);
        })
        .catch((err) => {
          console.log('Service Worker registration failed:', err);
        });
    });
  }
})();
</script>

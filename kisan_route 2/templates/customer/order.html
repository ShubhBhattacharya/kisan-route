{% extends 'base.html' %}
{% block content %}
<section class="feature-page">
  <h1>Order {{ listing.crop }}</h1>
  <p>From {{ listing.farmer }}, {{ listing.village }} — ₹{{ listing.price }} / {{ listing.unit }} ({{ listing.available_kg }} kg available)</p>
  <form method="post" class="form-grid">
    <div class="form-group"><label for="quantity">Quantity (kg)</label><input type="number" step="0.1" min="0" max="{{ listing.available_kg }}" id="quantity" name="quantity" required></div>
    <div class="form-group">
      <label for="payment_mode">Payment mode</label>
      <select id="payment_mode" name="payment_mode">
        <option value="cod">Cash on Delivery</option>
        <option value="upi">UPI (online)</option>
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Place order</button>
  </form>
</section>
{% endblock %}

<script>
// ================= GLOBAL KISAN TRANSITION & POLISH CONTROLLER =================
(function() {
  var overlay = null;
  var fillBar = null;
  var titleEl = null;
  var subEl = null;

  function initElements() {
    overlay = document.getElementById('krTransitionOverlay');
    fillBar = document.getElementById('krProgressFill');
    titleEl = document.getElementById('krLoaderMsg');
    subEl = document.getElementById('krLoaderSub');
  }

  window.triggerKisanTransition = function(options) {
    initElements();
    if (!overlay) return;

    options = options || {};
    var title = options.title || '🌾 खेत से सीधे मंडी की ओर...';
    var subtitle = options.subtitle || 'डैशबोर्ड लोड हो रहा है, कृपया प्रतीक्षा करें';
    var duration = options.duration || 900; // Snappy 900ms default
    var onComplete = options.onComplete || null;

    if (titleEl) titleEl.textContent = title;
    if (subEl) subEl.textContent = subtitle;
    if (fillBar) fillBar.style.width = '0%';

    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden', 'false');

    var startTime = performance.now();

    function step(now) {
      var elapsed = now - startTime;
      var progress = Math.min(elapsed / duration, 1);
      
      // Easing progress bar (starts swift, snaps clean)
      var eased = 1 - Math.pow(1 - progress, 2);
      if (fillBar) fillBar.style.width = (eased * 100) + '%';

      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        setTimeout(function() {
          if (typeof onComplete === 'function') {
            onComplete();
          } else if (options.url) {
            window.location.href = options.url;
          } else {
            overlay.style.display = 'none';
          }
        }, 120);
      }
    }

    requestAnimationFrame(step);
  };

  // Ensure overlay never gets stuck on browser back/forward navigation
  window.addEventListener('pageshow', function() {
    initElements();
    if (overlay) overlay.style.display = 'none';
  });

  document.addEventListener('DOMContentLoaded', function() {
    initElements();

    // 1. Intercept all Auth Login Forms to display animation for 1.7s before redirecting
    var authForms = document.querySelectorAll('.auth-card form');
    authForms.forEach(function(form) {
      form.addEventListener('submit', function(e) {
        if (form.dataset.animating === 'true') {
          return;
        }

        if (form.checkValidity && !form.checkValidity()) {
          return;
        }

        var roleName = 'डैशबोर्ड';
        var heading = document.querySelector('.auth-card h1');
        if (heading) {
          roleName = heading.textContent.replace('🌾', '').replace('🏬', '').replace('🛒', '').replace('🚚', '').replace('login', '').trim();
        }

        e.preventDefault();

        window.triggerKisanTransition({
          title: '🌾 ' + roleName + ' में प्रवेश हो रहा है...',
          subtitle: 'सत्यापन पूर्ण! आपका सुरक्षित डैशबोर्ड तैयार किया जा रहा है',
          duration: 1700,
          onComplete: function() {
            form.dataset.animating = 'true';
            form.submit();
          }
        });
      });
    });

    // 2. Intercept Bottom Dock Tab Navigation for smooth dashboard switching
    var dockTabs = document.querySelectorAll('.kr-dock-tab');
    dockTabs.forEach(function(tab) {
      var href = tab.getAttribute('href');
      if (href && href !== '#' && href !== 'javascript:void(0)') {
        tab.addEventListener('click', function(e) {
          if (tab.classList.contains('active')) return;
          e.preventDefault();
          var tabText = tab.querySelector('.kr-dock-text');
          var name = tabText ? tabText.textContent.trim() : 'पेज';
          
          window.triggerKisanTransition({
            title: '🌾 ' + name + ' की ओर प्रस्थान...',
            subtitle: 'Kisan Route: खेत से मंडी तक एक मार्ग',
            duration: 800,
            url: href
          });
        });
      }
    });

    // 3. Intercept All Multi-Dashboard & Cross-Portal Navigation Links
    document.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;

      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0) return;
      if (a.target === '_blank' || a.hasAttribute('download')) return;
      
      var href = a.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('tel:') || href.startsWith('mailto:') || href.startsWith('whatsapp:')) return;

      var destUrl;
      try {
        destUrl = new URL(a.href, window.location.origin);
      } catch(err) {
        return;
      }
      if (destUrl.origin !== window.location.origin) return;

      // Skip if clicking same exact URL
      if (destUrl.pathname === window.location.pathname && destUrl.search === window.location.search) return;

      var destPath = destUrl.pathname.toLowerCase();
      var curPath = window.location.pathname.toLowerCase();

      // Check if navigating to a dashboard or switching between portals
      var isDashboardTarget = destPath.indexOf('/dashboard') !== -1 ||
                              destPath.indexOf('/mandi-rates') !== -1 ||
                              destPath.indexOf('/profit-calculator') !== -1 ||
                              destPath.indexOf('/crop-quality') !== -1 ||
                              destPath.indexOf('/schemes') !== -1 ||
                              destPath.indexOf('/insurance') !== -1;

      var isPortalSwitch = (destPath.startsWith('/farmer') || destPath.startsWith('/wholesaler') || destPath.startsWith('/driver') || destPath.startsWith('/cluster') || destPath.startsWith('/customer')) &&
                           (!curPath.startsWith(destPath.split('/')[1]));

      if (isDashboardTarget || isPortalSwitch) {
        // Don't trigger if clicked element is inside a modal or button marked skip
        if (a.dataset.noTransition === 'true' || a.closest('.kr-bypass-overlay')) return;

        e.preventDefault();

        var title = '🌾 खेत से सीधे मंडी की ओर...';
        var subtitle = 'Kisan Route: सुरक्षित ग्रामीण डिजिटल नेटवर्क';

        if (destPath.indexOf('/farmer') !== -1) {
          title = '🌾 किसान पोर्टल (Farmer Hub) लोड हो रहा है...';
          subtitle = 'लाइव मंडी भाव, फसल गुणवत्ता व मुनाफा कैलकुलेटर';
        } else if (destPath.indexOf('/wholesaler') !== -1) {
          title = '🏬 थोक व्यापारी पोर्टल (Wholesaler Hub)...';
          subtitle = 'थोक फसल लॉट्स व डायरेक्ट फार्म-गेट सौदे';
        } else if (destPath.indexOf('/driver') !== -1) {
          title = '🚚 ड्राइवर व ट्रांसपोर्ट नेटवर्क (Logistics)...';
          subtitle = 'ग्रामीण वाहन व फसल परिवहन ट्रिप्स';
        } else if (destPath.indexOf('/cluster') !== -1) {
          title = '🤝 किसान क्लस्टर हब (Cluster Hub)...';
          subtitle = 'सामूहिक बिक्री व साझा ट्रांसपोर्ट';
        } else if (destPath.indexOf('/customer') !== -1) {
          title = '🛒 ताज़ा फसल स्टोर (Customer Market)...';
          subtitle = 'खेत से सीधी ताज़ा उपज की खरीदारी';
        }

        window.triggerKisanTransition({
          title: title,
          subtitle: subtitle,
          duration: 850,
          url: a.href
        });
      }
    });

    // 4. Floating Scroll to Top Button Interaction
    var scrollBtn = document.getElementById('krScrollToTopBtn');
    if (scrollBtn) {
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 320) {
          scrollBtn.style.display = 'flex';
        } else {
          scrollBtn.style.display = 'none';
        }
      }, { passive: true });

      scrollBtn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  });
})();
</script>

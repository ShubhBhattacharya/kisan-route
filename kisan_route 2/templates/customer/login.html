{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1><span aria-hidden="true">🛒</span> Customer login</h1>
    <form method="post">
      <div class="form-group"><label for="phone">Phone number</label><input type="tel" id="phone" name="phone" required></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('customer.signup') }}">Create a customer account</a></p>
  </div>
</section>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h1><span aria-hidden="true">🏬</span> Wholesaler login</h1>

    <!-- 1-Click Instant Demo Login Banner -->
    <div style="background: #e8f5e9; border: 1.5px solid #81c784; border-radius: 12px; padding: 14px; margin-bottom: 18px; text-align: center;">
      <div style="font-size: 13.5px; font-weight: 700; color: #1b5e20; margin-bottom: 5px;">
        💡 Quick Demo Access
      </div>
      <p style="font-size: 12px; color: #2e7d32; margin: 0 0 10px 0;">
        Demo Number: <strong>9876543210</strong> | Password: <strong>123456</strong>
      </p>
      <form method="post" style="margin: 0;">
        <input type="hidden" name="demo_login" value="1">
        <button type="submit" style="width: 100%; background: #2e7d32; color: #ffffff; border: none; padding: 9px 12px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(46,125,50,0.3);">
          <span>⚡</span> <span>1-Click Demo Login (सीधे लॉगिन करें)</span>
        </button>
      </form>
      <div style="margin-top: 8px;">
        <button type="button" onclick="openKrLoginModal('wholesaler')" style="width: 100%; background: #ffffff; color: #1b5e20; border: 1.5px solid #2e7d32; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <span>📲</span> <span>लॉगिन करें मोबाइल OTP से (SMS OTP)</span>
        </button>
      </div>
    </div>

    <form method="post">
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210" maxlength="10" minlength="10" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('wholesaler.signup') }}">Create a wholesaler account</a></p>
  </div>
</section>
{% endblock %}

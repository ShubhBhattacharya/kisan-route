{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
  <div class="auth-card auth-card-wide">
    <h1><span aria-hidden="true">🤝</span> Create your Farmer Cluster account</h1>
    <form method="post">
      <div class="form-grid">
        <div class="form-group"><label>Full name</label><input type="text" name="full_name" value="{{ form.get('full_name','') }}" required></div>
        <div class="form-group"><label>Phone number</label><input type="tel" name="phone" value="{{ form.get('phone','') }}" placeholder="e.g. 9876543210" maxlength="10" minlength="10" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" required></div>
        <div class="form-group"><label>Username</label><input type="text" name="username" value="{{ form.get('username','') }}" required></div>
        <div class="form-group"><label>User ID</label><input type="text" name="user_id" value="{{ form.get('user_id','') }}" required></div>
        <div class="form-group full-width"><label>Full address</label><input type="text" name="address" value="{{ form.get('address','') }}" required></div>
        <div class="form-group"><label>City</label><input type="text" name="city" value="{{ form.get('city','') }}" required></div>
        <div class="form-group"><label>State</label><input type="text" name="state" value="{{ form.get('state','') }}" required></div>
        <div class="form-group"><label>PIN code</label><input type="text" name="pincode" value="{{ form.get('pincode','') }}" required></div>
        <div class="form-group"><label>Aadhaar number</label><input type="text" name="aadhaar" value="{{ form.get('aadhaar','') }}" required></div>
        <div class="form-group full-width"><label>Create password</label><input type="password" name="password" required></div>
      </div>
      
      <button class="btn btn-primary" type="submit">Sign up</button>
      <p class="form-note">We'll send an OTP to verify your phone (demo mode — OTP shown on screen).</p>
      
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('cluster.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}

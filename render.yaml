# Render Background Worker Specification for KisanRoute Guardian AI
# Target runtime: Python 3.12+
# Runbook: docs/GUARDIAN_WORKER_DEPLOYMENT.md
services:
  - type: worker
    name: kisanroute-guardian-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python guardian_daemon.py --interval 120
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GUARDIAN_WORKER_ID
        value: render-guardian-worker-staging
      - key: DATABASE_URL
        sync: false
      - key: KISAN_ROUTE_SECRET_KEY
        sync: false
      - key: OWNER_PIN
        sync: false
      - key: OWNER_TOKEN
        sync: false

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KisanRoute Guardian AI — Admin Authentication</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-icon {
      font-size: 36px;
      margin-bottom: 12px;
      display: inline-block;
    }
    h2 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      letter-spacing: 4px;
      font-weight: 700;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus {
      border-color: #10b981;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-icon">🛡️</div>
  <h2>Guardian AI Control Center</h2>
  <p>Enter Master Admin PIN to authorize</p>

  <form method="POST" action="/admin/guardian/">
    <input type="password" name="pin" placeholder="••••••" maxlength="12" autofocus required>
    <button type="submit">Access Dashboard</button>
  </form>

  <div class="footer-note">
    Protected Administrative Gateway • KisanRoute SRE
  </div>
</div>

</body>
</html>

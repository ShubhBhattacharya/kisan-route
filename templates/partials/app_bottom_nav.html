<!-- ================= NATIVE MOBILE APP BOTTOM NAVIGATION DOCK (4 CLEAN TABS) ================= -->
<nav class="kr-app-bottom-dock" id="krAppBottomDock" aria-label="App Navigation">
  <a href="{{ url_for('main.home') }}" class="kr-dock-tab {% if request.path == '/' %}active{% endif %}">
    <span class="kr-dock-icon">🏠</span>
    <span class="kr-dock-text">Home</span>
  </a>

  <a href="{{ url_for('customer.dashboard') }}" class="kr-dock-tab {% if '/customer/dashboard' in request.path %}active{% endif %}">
    <span class="kr-dock-icon">📦</span>
    <span class="kr-dock-text">Categories</span>
  </a>

  <a href="/portal/farmer" class="kr-dock-tab {% if '/farmer' in request.path %}active{% endif %}">
    <span class="kr-dock-icon">🚜</span>
    <span class="kr-dock-text">Farmer</span>
  </a>

  <a href="/portal/customer" class="kr-dock-tab {% if '/customer' in request.path and '/dashboard' not in request.path %}active{% endif %}">
    <span class="kr-dock-icon">🛒</span>
    <span class="kr-dock-text">Cart/Customer</span>
  </a>
</nav>

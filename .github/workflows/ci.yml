name: Kisan Route CI

on:
  push:
    branches:
      - main
      - "market-readiness/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        env:
          PYTHONPATH: .
          SECRET_KEY: ci-only-not-for-production
          FLASK_DEBUG: "1"
          TEST_DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m unittest discover -s tests -t . -v > test_output.txt 2>&1 || {
            tail -n 20 test_output.txt | while IFS= read -r line; do
              echo "::error title=TestFailure::$line"
            done
            cat test_output.txt
            exit 1
          }
          cat test_output.txt
